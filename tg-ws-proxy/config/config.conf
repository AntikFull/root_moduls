# Конфигурация Telegram WS Proxy (tg-ws-proxy) v1.2.0
# Автор: eCubz (https://t.me/eCubz)
# Расположение на устройстве: /data/adb/tg-ws-proxy/config.conf

# Локальный адрес и порт прослушивания
HOST="127.0.0.1"
PORT="1443"

# Секрет MTProto (32 hex-символа). Оставьте пустым для автогенерации постоянного ключа
SECRET=""

# FakeTLS домен маскировки (для ee-секрета). По умолчанию пусто (чистый MTProto на loopback)
# Имеет смысл включать только при HOST="0.0.0.0" для раздачи прокси в локальную сеть
FAKE_TLS_DOMAIN=""

# Пул резервных Cloudflare-доменов. ПУСТО = использовать динамический список апстрима
# Заполнять ТОЛЬКО если знаете рабочий домен: любое значение здесь отключает авто-обновление
CFPROXY_DOMAINS=""

# Источник списка резервных доменов апстрима (авто-обновление раз в час)
CFPROXY_DOMAINS_URL="https://raw.githubusercontent.com/spatiumstas/tg-ws-proxy-go/main-go/.github/cfproxy-domains.txt"

# Свой Cloudflare Worker (если развёрнут). Пробуется в первую очередь
CFPROXY_WORKER_DOMAIN=""

# 1 - пробовать Cloudflare раньше прямого TCP, 0 - сначала прямой TCP к дата-центрам
# По умолчанию 0: на 2026-08-23 у доменов апстрима отсутствуют A-записи
CFPROXY_PRIORITY="0"

# Размер пула соединений на дата-центр:
# 1 - экономия батареи Android (4 сокета, рекомендуется)
# 0 - отключить предпрогрев пула (максимум экономии)
# 4 - серверный/роутерный режим (до 16 сокетов)
POOL_SIZE="1"

# Буфер сокета в КБ
BUF_KB="64"

# Максимальное количество одновременных клиентских сессий
MAX_CONNS="256"

# Максимальный размер лог-файла в МБ перед ротацией демона
LOG_MAX_MB="2"
LOG_BACKUPS="1"

# Подробные логи демона (0 - выкл, 1 - вкл)
VERBOSE="0"

# Дополнительные аргументы командной строки
EXTRA_ARGS=""

# Пакет Telegram для прямого открытия интента (например, org.telegram.messenger)
# Если пусто, Android покажет диалог выбора приложения
TG_PACKAGE=""
