# NFQTTL eCubz configuration
# Base profile: tethering-only TTL/Hop-Limit masking with minimal side effects.

TTL_VALUE=64
HL_VALUE=64

# Core anti-tethering layer: reduce Android-side DUN/provisioning/entitlement signaling.
# Original values are saved outside the module directory and restored on uninstall.
CARRIER_PROVISIONING_BYPASS=1

# Hardware/eBPF tethering offload may bypass iptables/NFQUEUE.
# 1 = disable while module is installed, preserving previous values for uninstall rollback.
OFFLOAD_CONTROL=1

# Drop inbound cellular packets with TTL/Hop-Limit 1 before forwarding can emit time-exceeded.
TTL1_PROTECTION=1

# Optional compatibility features. Disabled by default.
CLAMP_MSS=0
ENABLE_DNS_REDIRECT=0
BLOCK_DOT=0
BLOCK_NTP=0
BLOCK_DISCOVERY=0
ENABLE_BLOCKLIST=0

# NFQUEUE compatibility fallback. The bundled legacy binaries are used only if native TTL/HL targets are absent.
# Controller watches queue backlog/drop counters and temporarily opens the path on overload.
NFQUEUE_OVERLOAD_GUARD=1
NFQUEUE_BACKLOG_LIMIT=768
NFQUEUE_OVERLOAD_LIMIT=3

# Lightweight self-healing controller. Does NOT force ip_forward and does not run nfqttl in native mode.
CONTROLLER_ENABLE=1
CONTROLLER_INTERVAL=30

# When a file named debug exists in the module directory, service.sh can generate a fresh report.
DEBUG_AUTO_REPORT=1

# Space-separated iptables interface patterns, e.g. "wifiap+ eth1".
EXTRA_CLIENT_IFS=""
EXTRA_UPSTREAM_IFS=""
