name: Build and Publish Release Module

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read module metadata
        id: metadata
        run: |
          VERSION=$(grep '^version=' module.prop | cut -d'=' -f2 | tr -d '\r\n')
          VERSION_CODE=$(grep '^versionCode=' module.prop | cut -d'=' -f2 | tr -d '\r\n')
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "VERSION_CODE=$VERSION_CODE" >> $GITHUB_ENV
          echo "Module Version: $VERSION ($VERSION_CODE)"

      - name: Prepare release notes
        run: |
          if [ -f "CHANGELOG.md" ]; then
            cat CHANGELOG.md README.md > release_notes.md
          else
            cp README.md release_notes.md
          fi

      - name: Ensure Unix LF line endings and permissions
        run: |
          sudo apt-get update && sudo apt-get install -y dos2unix zip
          dos2unix service.sh customize.sh action.sh debug_log.sh module.prop LICENSE README.md CHANGELOG.md 2>/dev/null || true
          chmod 755 service.sh customize.sh action.sh debug_log.sh nfqttl libs/*/* 2>/dev/null || true

      - name: Package Universal Magisk/KSU Module ZIP
        run: |
          ZIP_NAME="nfqttl_ecubz-${VERSION}.zip"
          zip -r "$ZIP_NAME" module.prop service.sh customize.sh action.sh nfqttl libs blocklist.txt debug_log.sh LICENSE README.md CHANGELOG.md
          echo "ZIP_NAME=$ZIP_NAME" >> $GITHUB_ENV

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ env.VERSION }}
          name: Nfqttl ${{ env.VERSION }}
          body_path: release_notes.md
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
