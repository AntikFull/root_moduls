# Глобальная конфигурация Zapret2 eCubz для Android
# Автор: eCubz (https://t.me/eCubz)
# Telegram группа: https://t.me/module_ecubz (t.me/module_ecubz)
# SMART v2.9:
# - auto_apps.list      — встроенный каталог приложений, подхватываются только реально установленные пакеты;
# - apps.list           — ручные добавления пользователя;
# - exclude.list        — ручные исключения, имеют максимальный приоритет;
# - smart_youtube.list  — встроенный доменный профиль YouTube/Google Video;
# - exclude_domains.list — домены, которые nfqws2 не модифицирует.

# Режим фильтрации трафика приложений:
# INCLUDE — SMART auto-apps + ручные apps.list, кроме exclude.list.
# EXCLUDE — весь телефон, кроме exclude.list.
# GLOBAL  — весь телефон без UID-ограничения.
MODE="INCLUDE"
SCOPE_PRESET="SELECTED"

# Автовыбор приложений из встроенного каталога. В правила попадают только установленные пакеты.
AUTO_APPS_ENABLED="1"

# Единственный обычный режим стратегии — SMART.
# SMART_NATIVE: circular/autoselection при наличии reply-feed capabilities.
# SMART_ACTIVE: активная проверка DIRECT/стратегий по сети без входящего bulk-трафика, если ядро ограничено.
# CUSTOM оставлен только для экспертного режима/совместимости CLI.
STRATEGY_MODE="SMART"

# SMART_NATIVE должен видеть первые ответные пакеты сервера. Bulk-трафик не очередится.
AUTO_REPLY_PACKETS="12"
FLOW_CONNMARK="0x10000000/0x10000000"

# Активный AUTO для ядер без xt_connbytes. Подбор выполняется в фоне и
# кэшируется отдельно для каждой Wi-Fi/мобильной сети.
AUTO_SELECT_ENABLED="1"
AUTO_CACHE_TTL="86400"
AUTO_WIFI_CACHE_TTL="86400"
AUTO_CELL_CACHE_TTL="3600"
AUTO_PERIODIC_RECHECK="1800"
AUTO_TEST_QNUM="201"
AUTO_TEST_PORT_MIN="39000"
AUTO_TEST_PORT_MAX="39049"
AUTO_TEST_TIMEOUT="5"
# strategy_1 — DIRECT. Профиль по умолчанию до первого удачного probe должен
# защищать, поэтому это первая реальная стратегия, а не DIRECT.
AUTO_PROFILE_DEFAULT="strategy_2"

# Контрольные хосты активного probe.
# ВАЖНО: Домены для проверки сети теперь можно задавать в отдельном файле `probe_hosts.list`!
# Если `probe_hosts.list` присутствует и заполнен, модуль берет домены проверки из него.
# Иначе используются резервные переменные ниже.
AUTO_PROBE_HOSTS_GENERAL="discord.com=200// www.instagram.com=200// x.com=200//"
AUTO_PROBE_HOSTS_GOOGLE="www.youtube.com=204//generate_204 youtubei.googleapis.com=204//generate_204 redirector.googlevideo.com=200//report_mapping"
# Ограничение числа проверяемых стратегий за один прогон; 0 — без ограничения.
AUTO_PROBE_MAX_CANDIDATES="0"

# Если сеть не фильтруется (все probe-хосты открываются без обхода) ИЛИ имя текущей
# Wi-Fi сети (SSID) внесено в файл `wifi_direct_ssids.list`, AUTO выбирает DIRECT:
# nfqws2 и NFQUEUE-правила не поднимаются вообще.
# Это основной режим энергосбережения на домашнем Wi-Fi (с OpenWRT/Keenetic).
AUTO_ALLOW_DIRECT="1"

# Принудительный перевод приложений с QUIC/HTTP3 на TCP.
FORCE_TCP="1"
QUIC_MODE="SELECTED"
PORTS_TCP="80,443,5222,8443"
QNUM="200"

# Совместимость и диагностика
LOG_VERBOSE="1"
PACKAGE_WAIT_SECONDS="60"
NFQWS_DEBUG="0"

# Hotspot / USB tether
ENABLE_HOTSPOT="1"
TETHER_IFACES="ap+ swlan+ softap+ ap_br_wlan+ ap_br_softap+ rndis+ usb+ ncm+ bnep+ bt-pan+ pan+ tether+ wlan1 wlan2 wlan3 wlan4 wifi1 wifi2 wifi3 wifi4"
FORCE_TCP_HOTSPOT="1"

# VPN -> Hotspot/USB
ENABLE_VPN_HOTSPOT="0"
VPN_TUN_NAME="AUTO"
VPN_ROUTE_PREF_BASE="20550"
VPN_ROUTE_TABLE="11999"
VPN_HOTSPOT_MASQUERADE="1"
VPN_FALLBACK_MODE="ANTIDPI"
VPN_HOTSPOT_KILLSWITCH="0"
# Watcher блокируется на rtnetlink-событии (read -t по FIFO), а не опрашивает
# флаг каждые 2 сек. Значение ниже — только резервный таймаут пробуждения.
VPN_WATCH_INTERVAL="20"
VPN_RETRY_INTERVAL="2"
# Резервная строгая проверка ролей, если vendor/netlink не прислал событие.
# интерфейсов изменилась, поэтому большой интервал ничего не ломает.
VPN_ROLE_RECHECK="120"
# Debounce нескольких netlink/netd событий в одну проверку ролей.
VPN_EVENT_DEBOUNCE="2"
# Linux rtnetlink `ip monitor all` — основной быстрый триггер интерфейсных изменений.
VPN_NETLINK_MONITOR="1"
# Проверка drift наших уже установленных правил без teardown.
VPN_VERIFY_INTERVAL="300"
# Legacy <=2.8.0; больше не используется горячим циклом watcher.
VPN_STATE_RECHECK="10"
HEALTH_WATCH_INTERVAL="60"

# DNS forcing для клиентов Hotspot/USB (обычный UDP/TCP 53; DoH/DoT не перехватываются)
DNS_FORWARD_HOTSPOT="0"
DNS_FORWARD_SERVERS="1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 9.9.9.9 149.112.112.112"
DNS_FORWARD_SERVER="1.1.1.1"

# =============================================================================
# Cloudflare WARP (AmneziaWG v3) — точечный туннель для Telegram и выбранных приложений
# =============================================================================
# 0 — отключено (по умолчанию), 1 — включено
ENABLE_WARP="0"
WARP_DEV="awg99"
WARP_JC="5"
WARP_JMIN="40"
WARP_JMAX="70"
WARP_S1="0"
WARP_S2="0"
WARP_S3="0"
WARP_S4="0"
WARP_H1="1"
WARP_H2="2"
WARP_H3="3"
WARP_H4="4"
# I1-I5 ниже — шаблоны аварийного CPS/SIP fallback. В свежий warp.conf они НЕ
# записываются сразу: автоматика включает их только после неудач BASIC-профилей.
WARP_I1="<b >"
WARP_I2="<b >"
WARP_I3=""
WARP_I4=""
WARP_I5=""
WARP_ENDPOINT="162.159.192.1"
WARP_PORT="500"
WARP_DNS="1.1.1.1 1.0.0.1"
WARP_DNS_FORCE="1"
# Адаптивный перебор: сначала BASIC без I1/I2 с разными J*/endpoint, затем SIP I1/I2.
WARP_ADAPTIVE="1"
# 1 = полный автоматический перебор; 0 = строго использовать значения из WebUI.
WARP_SIP_FORCE="0"
# AUTO всегда завершает полный цикл из 40 кандидатов и только после этого
# показывает "профиль не найден". Значение оставлено как совместимый override,
# но значения меньше полной матрицы автоматически повышаются до её размера.
WARP_STARTUP_TRIES="40"
WARP_PROBE_TIMEOUT="3"
# Сколько следующих кандидатов проверять за один health-watch после потери
# ранее рабочего профиля. Первичный подбор выполняется полностью при start/restart.
WARP_WATCH_BATCH="5"
# После полного провала не крутить цикл бесконечно: пауза перед новой попыткой.
WARP_ADAPT_RETRY_SEC="300"
WARP_ROUTE_TABLE="11888"

# =============================================================================
# =============================================================================
# General: безопасный статический compatibility-профиль без incoming reply-feed.
DESYNC_ARGS_SMART_COMPAT_GENERAL="--filter-tcp=80,443,5222,8443 --filter-l7=http,tls --out-range=-d10 --payload=tls_client_hello --lua-desync=fake:blob=fake_default_tls:tcp_md5:tcp_seq=-10000:repeats=6 --lua-desync=multidisorder:pos=midsld --payload=http_req --lua-desync=fake:blob=fake_default_http:ip_autottl=-1,3-20:tcp_md5 --lua-desync=fakedsplit:ip_autottl=-1,3-20:tcp_md5 --new --filter-tcp=80,443,5222,8443 --payload=all,empty --out-range=-d10 --lua-desync=synack:ipfrag:ipfrag_pos_tcp=8:ipfrag_disorder --lua-desync=multisplit:pos=1,2"

# YouTube/Google Video: отдельный SMART-профиль. Использует fake TLS + multidisorder,
# чтобы не зависеть от прежнего универсального SIMPLE профиля.
DESYNC_ARGS_SMART_COMPAT_YOUTUBE="--filter-tcp=443 --filter-l7=tls --out-range=-d10 --payload=tls_client_hello --lua-desync=fake:blob=fake_default_tls:tcp_md5:repeats=11:tls_mod=rnd,dupsid,sni=www.google.com --lua-desync=multidisorder:pos=1,midsld"

# v2.5.5-v2.7.x; SPLIT_SAFE использует минимальную модификацию ClientHello.
DESYNC_ARGS_AUTO_SIMPLE_ALT4="--filter-tcp=443 --filter-l7=tls --out-range=-d10 --payload=tls_client_hello --lua-desync=fake:blob=0x00000000:repeats=6:tcp_seq=1000:tcp_ack=-66000:tcp_ts_up --lua-desync=multisplit:pos=1,midsld:seqovl=1"
DESYNC_ARGS_AUTO_SPLIT_SAFE="--filter-tcp=443 --filter-l7=tls --out-range=-d10 --payload=tls_client_hello --lua-desync=multidisorder:pos=1,sniext+1,midsld,endhost-1"

# =============================================================================
# =============================================================================
# General circular: несколько стратегий на хост, переключение по детекторам zapret2.
DESYNC_ARGS_SMART_NATIVE_GENERAL="--filter-tcp=80,443,5222,8443 --filter-l7=http,tls --in-range=-s4096 --out-range=-d10 --payload=tls_client_hello --lua-desync=circular:fails=2:time=180:retrans=3:nld=2 --lua-desync=fake:blob=fake_default_tls:tcp_md5:tcp_seq=-10000:repeats=6:strategy=1 --lua-desync=multidisorder:pos=midsld:strategy=1 --lua-desync=wssize:wsize=1:scale=6:strategy=2 --lua-desync=multidisorder:pos=1,sniext+1,host+1,midsld-2,midsld,midsld+2,endhost-1:strategy=2 --lua-desync=fake:blob=0x00000000:tcp_ack=-66000:tcp_ts_up:repeats=6:strategy=3 --lua-desync=multisplit:pos=1,midsld:seqovl=1:strategy=3 --payload=http_req --lua-desync=circular:fails=2:time=180:retrans=3:nld=2 --lua-desync=fake:blob=fake_default_http:tcp_md5:strategy=1 --lua-desync=fakedsplit:ip_autottl=-1,3-20:tcp_md5:strategy=1 --lua-desync=multidisorder:pos=1,midsld:strategy=2 --lua-desync=fake:blob=0x00000000:tcp_ack=-66000:tcp_ts_up:repeats=4:strategy=3 --lua-desync=multisplit:pos=1,midsld:strategy=3 --new --filter-tcp=80,443,5222,8443 --payload=all,empty --out-range=-d10 --lua-desync=synack:ipfrag:ipfrag_pos_tcp=8:ipfrag_disorder --lua-desync=multisplit:pos=1,2"

# YouTube circular: первый кандидат ориентирован на современные Google/YouTube TLS,
# затем более консервативные варианты. Требует тот же reply-feed, что и circular upstream.
DESYNC_ARGS_SMART_NATIVE_YOUTUBE="--filter-tcp=443 --filter-l7=tls --in-range=-s4096 --out-range=-d10 --payload=tls_client_hello --lua-desync=circular:fails=2:time=120:retrans=3:nld=2 --lua-desync=fake:blob=fake_default_tls:tcp_md5:repeats=11:tls_mod=rnd,dupsid,sni=www.google.com:strategy=1 --lua-desync=multidisorder:pos=1,midsld:strategy=1 --lua-desync=wssize:wsize=1:scale=6:strategy=2 --lua-desync=multidisorder:pos=1,sniext+1,host+1,midsld-2,midsld,midsld+2,endhost-1:strategy=2 --lua-desync=fake:blob=fake_default_tls:tcp_ack=-66000:tcp_ts_up:repeats=6:tls_mod=rnd,dupsid,sni=www.google.com:strategy=3 --lua-desync=multisplit:pos=1,midsld:seqovl=1:strategy=3"

# Экспертный CUSTOM. Обычный WebUI SMART его не использует.
DESYNC_ARGS_CUSTOM="--filter-tcp=80,443,5222,8443 --filter-l7=http,tls --payload=tls_client_hello --lua-desync=fake:blob=0x00000000:repeats=6:tcp_seq=1000:tcp_ack=-66000:tcp_ts_up --lua-desync=multisplit:pos=1,midsld:seqovl=1 --new --filter-tcp=80,443,5222,8443 --payload=all,empty --lua-desync=synack:ipfrag:ipfrag_pos_tcp=8:ipfrag_disorder --lua-desync=multisplit:pos=1,2"
