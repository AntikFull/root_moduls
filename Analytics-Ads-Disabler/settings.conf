# Analytics & Ads Disabler v4 вЂ” runtime settings (editable live; Action can configure)
# COMPONENT_MODE: SAFE | BALANCED | AGGRESSIVE
# 1 = enabled, 0 = disabled
BLOCK_ANALYTICS=1
BLOCK_ADS=1
COMPONENT_MODE=SAFE
COMPONENT_BACKEND=PM
SCAN_ALL_USERS=1
SCAN_SYSTEM_APPS=0
BLOCK_PUSH_SDK=0
AD_SURFACE_KILLER=1
# auto  = TLS-SNI string matching when the kernel supports xt_string,
#         otherwise the resolved-IP mode if AD_KILLER_IP_FALLBACK=1.
# string= require xt_string (exact, no collateral damage).
# ip    = block resolved ad-host addresses per app UID (works on kernels without
AD_KILLER_MODE=auto
AD_KILLER_IP_FALLBACK=0
# Evidence required before a host is blocked for an app:
AD_KILLER_MIN_CONFIDENCE=CAPABILITY
# Risky opt-in: 1 blocks UDP/443 for targeted app UIDs to force TCP/TLS.
AD_KILLER_FORCE_TCP=0
REALTIME_MONITOR=1
CATEGORY_POLL_INTERVAL=10
PACKAGE_POLL_INTERVAL=60
PACKAGE_SAFETY_POLL_INTERVAL=900
MAX_MATCHES_PER_CATEGORY=15
MAX_AGGRESSIVE_ADS_MATCHES=64
MAX_IFW_ACTIVITIES_PER_CATEGORY=5
MAX_AGGRESSIVE_IFW_ACTIVITIES_PER_CATEGORY=64
# Log mirroring to /sdcard. Emulated storage is world-readable, so the
# package-level inventories are mirrored only with LOG_MIRROR_FULL=1.
LOG_MIRROR=1
LOG_MIRROR_FULL=0
LOG_MIRROR_INTERVAL=60
# Xposed/LSPosed bridge: auto = export target evidence only when an Xposed-family
# framework is detected. 1 = always export, 0 = never. The module never hooks.
XPOSED_BRIDGE=auto
