# Формат профиля:
# SCOPE|ABI|LIBIL2CPP_SHA256|TYPE|ASSEMBLY|NAMESPACE|CLASS|METHOD|RETURN_TYPE|PARAM_TYPES[|REWARD_METHOD|REWARD_RETURN_TYPE|REWARD_PARAM_TYPES]
# PARAM_TYPES: точные имена Il2CppType через запятую либо "-". Поддерживается show с 0..2 ссылочными аргументами.
# READY пример:
# com.example.game.qa|arm64-v8a|<64-hex>|READY|Assembly-CSharp|Game.Ads|RewardedController|IsReady|System.Boolean|-
# SHOW_REWARD пример:
# com.example.game.qa|arm64-v8a|<64-hex>|SHOW_REWARD|Assembly-CSharp|Game.Ads|RewardedController|ShowRewarded|System.Void|-|RewardUser|System.Void|-
