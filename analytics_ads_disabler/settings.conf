# ==============================================================================
# Analytics & Ads Disabler v7 — настройки
# Автор: eCubz (https://t.me/eCubz) • Группа: https://t.me/module_ecubz
#
# После изменения файла нажмите кнопку Action в менеджере root, чтобы
# перегенерировать политику, и перезапустите изменённые приложения.
# ==============================================================================

# --- Основные переключатели ---------------------------------------------------

# Блокировать рекламу: сетевые запросы рекламных SDK, полноэкранные экраны,
# баннерные контейнеры и рекламу внутри WebView.
BLOCK_ADS=1

# Блокировать аналитику и атрибуцию: Firebase Analytics, AppsFlyer, Adjust,
# AppMetrica, Amplitude и аналогичные.
BLOCK_ANALYTICS=1

# Обрабатывать системные приложения. По умолчанию выключено: системные
# приложения исключаются из инструментирования. Включение даёт блокировку
# рекламы в приложениях прошивки, но затрагивает больше процессов.
INCLUDE_SYSTEM_APPS=0

# --- Слои движка --------------------------------------------------------------
# Каждый слой можно выключить отдельно, если он мешает конкретному приложению.

# Сетевой слой: отклонять запросы к рекламным эндпоинтам изнутри процесса.
# Это основной слой. Отключать имеет смысл только при диагностике.
NET_GUARD=1

# Выключать системы аналитики их собственным штатным API (тем, что сделан
# ради GDPR). Самый дешёвый слой: трекер вообще не начинает собирать события,
# не пишет их на диск и не ставит повторные отправки. Работает только при
# BLOCK_ANALYTICS=1.
SDK_OPT_OUT=1

# Схлопывать баннерные и нативные контейнеры, чтобы на их месте не оставалось
# пустой полосы.
COLLAPSE_VIEWS=1

# Закрывать полноэкранные рекламные экраны (interstitial, app-open, rewarded).
# Выключите, если приложение выдаёт награду только после просмотра ролика.
CLOSE_AD_SCREENS=1

# Косметический фильтр внутри WebView: скрывает рекламные блоки на HTML-страницах
# во встроенных браузерах приложений.
WEBVIEW_COSMETIC=1

# --- Диагностика --------------------------------------------------------------

# Подробный лог в logcat по тегу AAD-Core. Держите выключенным в обычной работе.
VERBOSE_LOG=0

# Режим аудита. Включайте, когда нужно разобраться, почему в приложении всё
# ещё видна реклама. В logcat попадает список рекламных SDK, найденных в
# приложении, и КАЖДЫЙ уникальный хост с вердиктом — включая пропущенные,
# с указанием, чей код открыл соединение.
#
# Разбор:  logcat -s AAD-Core | grep AUDIT
#
# Строка «AUDIT ПРОПУСК <хост> инициатор=реклама:<класс>» означает, что этот
# хост нужно добавить в [AD_HOSTS] файла rules.conf.
AUDIT_LOG=0
