# ==============================================================================
# Analytics & Ads Disabler v7 — пользовательские правила
# Автор: eCubz (https://t.me/eCubz) • Группа: https://t.me/module_ecubz
#
# Эти правила ДОБАВЛЯЮТСЯ к встроенным. Убрать встроенную сигнатуру отсюда
# нельзя — так пользовательское правило не может случайно снять защиту.
# Если конкретное приложение ломается, исключите его целиком в whitelist.list.
#
# После правки файл применяется автоматически либо по кнопке Action.
# Изменения вступают в силу при следующем запуске приложения.
#
# Ограничение: не более 512 записей в каждой секции.
# ==============================================================================


# [AD_PACKAGES]
# Префиксы пакетов рекламных SDK. Любое соединение, открытое кодом с таким
# префиксом, отклоняется, а его View и Activity считаются рекламными.
#
# Точка на конце обязательна: без неё префикс "com.foo" совпадёт и с
# "com.foobar.something".
#
# Пример:
# com.example.adnetwork.
[AD_PACKAGES]


# [ANALYTICS_PACKAGES]
# То же самое для систем аналитики и атрибуции.
#
# Пример:
# com.example.tracker.
[ANALYTICS_PACKAGES]


# [AD_HOSTS]
# Рекламные эндпоинты. Совпадение по домену и всем его поддоменам:
# запись "ads.example.com" перекрывает и "eu.ads.example.com".
#
# Не указывайте здесь общие домены продукта. Запись "example.com" отрежет
# приложению всё, включая его собственный API.
#
# Пример:
# ads.example.com
[AD_HOSTS]


# [ANALYTICS_HOSTS]
# Эндпоинты аналитики, по тем же правилам.
#
# Пример:
# telemetry.example.com
[ANALYTICS_HOSTS]


# [NEVER_BLOCK_HOSTS]
# Хосты, которые нельзя блокировать по косвенному признаку.
#
# Движок умеет отклонять соединение, если его открывает код рекламного SDK,
# даже когда домен неизвестен. Иногда такой код обращается к общему сервису,
# от которого зависит само приложение. Добавьте сюда его адрес, если после
# установки модуля приложение перестало грузить свой контент.
#
# На секции [AD_HOSTS] и [ANALYTICS_HOSTS] эта защита не действует: явное
# правило всегда сильнее.
#
# Пример:
# api.myapp.com
[NEVER_BLOCK_HOSTS]


# [AD_VIEWS]
# Полные имена классов рекламных контейнеров, которые нужно схлопывать.
# Нужно только для нестандартных SDK: контейнеры из перечисленных выше
# пакетов распознаются по префиксу автоматически.
#
# Пример:
# com.example.ui.PromoBannerView
[AD_VIEWS]


# [AD_ACTIVITIES]
# Полные имена классов полноэкранных рекламных Activity, которые нужно
# закрывать до отрисовки.
#
# Пример:
# com.example.ui.FullscreenPromoActivity
[AD_ACTIVITIES]
