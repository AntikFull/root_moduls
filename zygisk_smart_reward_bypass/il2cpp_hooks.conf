# Конфигурация перехвата и инспекции IL2CPP (IL2CPP Method Resolver & Bypass)
# Автор: eCubz (https://t.me/eCubz)
#
# Назначение:
# Нативная C++ часть производит поиск адресов MethodInfo* в загруженном рантайме libil2cpp.so
# и безопасно подменяет methodPointer на универсальные ассемблерные трамплины (Leaf Stubs).
#
# Синтаксис:
#   [Assembly.dll|]Namespace.Class::MethodName|action|arg_count
#
# Поддерживаемые действия (action):
#   always_true       - принудительный возврат true (1) при проверке готовности рекламы (ABI-safe)
#   show_and_reward   - безопасный перехват показа и рассылка наград через активный SDK адаптер
#   resolve / observe - пассивный поиск MethodInfo* и логирование адреса (без мутации)

# --- Селективные правила для рекламных и наградных классов ---
*|*Rewarded*::*Is*Ready*|always_true|-1
*|*Rewarded*::*Is*Loaded*|always_true|-1
*|*Rewarded*::*Is*Available*|always_true|-1
*|*RewardedVideo*::*Is*Ready*|always_true|-1
