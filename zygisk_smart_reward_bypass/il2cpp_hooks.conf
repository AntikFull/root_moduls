# из метаданных загруженной версии SDK.
*|UnityEngine.Advertisements.Advertisement::Show|show_and_reward|-1

# --- Общие правила показа для обёрток приложения ---
# Применяются к любому классу. Безопасность обеспечивается не сужением списка
# классов, а проверкой в hook_method_show_and_reward: подмена выполняется, только
# если метод принимает коллбэк завершения (System.Action или Action<простой тип>)
# либо является точкой входа рекламного SDK. Без коллбэка обёртка приложения не
# подменяется — иначе теряется её внутреннее состояние.
*|*::*ShowRewardedVideo*|show_and_reward|-1
*|*::*ShowRewardedAd*|show_and_reward|-1
*|*::*ShowRewarded*|show_and_reward|-1
*|*::*ShowVideoAd*|show_and_reward|-1
