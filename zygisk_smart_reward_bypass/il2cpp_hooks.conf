*|GoogleMobileAds.Api.RewardedInterstitialAd::CanShowAd|always_true|-1
*|GoogleMobileAds.Api.RewardedInterstitialAd::Show|show_and_reward|-1
*|GoogleMobileAds.Api.InterstitialAd::CanShowAd|always_true|-1
*|GoogleMobileAds.Api.InterstitialAd::Show|show_and_reward|-1

