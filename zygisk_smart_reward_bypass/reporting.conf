# SmartReward reporting / garbage-collection policy
# Values are intentionally conservative: uninstall does not erase data immediately.
REPORT_ARCHIVE_AFTER_DAYS=7
REPORT_DELETE_AFTER_DAYS=30
REPORT_KEEP_UNINSTALLED=1
REPORT_GC_INTERVAL_SEC=3600
REPORT_MAX_HISTORY_FILES_PER_PACKAGE=200
REPORT_MAX_EVENT_LINES_PER_PACKAGE=0

# Захват logcat в runtime.log (0 = выключено для экономии батареи и глубокого сна UFS, 1 = включено)
# Также можно переключать созданием файла-флага /data/adb/zygisk_smart_reward_bypass/debug
ENABLE_LOGCAT=0
