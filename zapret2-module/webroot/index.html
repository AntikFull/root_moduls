<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><meta http-equiv="Pragma" content="no-cache"><meta http-equiv="Expires" content="0"><title>Zapret2 eCubz</title><style>
:root{color-scheme:dark;--bg:#10151f;--card:#1b2432;--ok:#70e09a;--bad:#ff8591}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:#ecf3ff;font:16px system-ui,sans-serif}main{max-width:850px;margin:auto;padding:18px}h1{font-size:24px}section{background:var(--card);border-radius:13px;padding:16px;margin:12px 0}button,select,input{font:inherit;padding:9px;border-radius:8px;border:1px solid #52647d;background:#101925;color:inherit}button{background:#197bb5;border:0;cursor:pointer}button:disabled{opacity:.5;cursor:wait}textarea{width:100%;min-height:150px;background:#101925;color:inherit;border:1px solid #52647d;border-radius:8px;padding:10px;font:13px ui-monospace,monospace}.ok{color:var(--ok)}.bad{color:var(--bad)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}.muted{opacity:.75;font-size:13px}.app-filters{display:flex;gap:14px;margin:10px 0}.app-row{display:flex;align-items:center;gap:10px;border-top:1px solid #334258;padding:9px 0;flex-wrap:wrap}.app-name{flex:1 1 260px;min-width:220px}.app-name small{display:block;opacity:.65;font:12px ui-monospace,monospace}pre{white-space:pre-wrap;max-height:220px;overflow:auto}</style></head>
<body><main><h1>Zapret2 eCubz</h1><p id="state">Загрузка статуса…</p><p id="notice" class="muted"></p>
<section><h2>Работа модуля</h2><div class="grid"><label>Режим<br><select id="mode"><option value="exclude">Исключать приложения</option><option value="include">Только выбранные приложения</option><option value="global">Весь трафик</option></select></label><label>QUIC<br><select id="quic"><option value="off">Не блокировать</option><option value="selected">Только выбранные приложения</option><option value="global">Всё устройство</option></select></label><label>TCP fallback<br><select id="tcp"><option value="1">Включён</option><option value="0">Выключен</option></select></label></div><p><button id="applyBtn" onclick="applySettings()">Применить</button> <button id="restartBtn" onclick="runCommand('restart')">Перезапустить</button></p><p class="muted">WebUI работает внутри KernelSU Next и не занимает сетевой порт.</p></section>
<section><h2>Приложения</h2><input id="search" placeholder="Поиск пакета" oninput="renderApps()"><div id="apps"></div></section>
<section><h2>Списки доменов и приложений</h2><label>Список <select id="list" onchange="readList()"><option value="auto-domains">Домены дополнительной стратегии</option><option value="exclude-domains">Доменные исключения</option><option value="apps">Приложения INCLUDE</option><option value="exclude">Приложения EXCLUDE</option><option value="force-tcp">Приложения TCP fallback</option></select></label><p><textarea id="listText"></textarea></p><button onclick="saveList()">Сохранить список</button></section>
<section><h2>Журнал</h2><button onclick="loadLog()">Обновить</button><pre id="log"></pre></section></main><script>
const api=(query,options={})=>fetch('cgi-bin/api?'+query+'&_='+Date.now(),{cache:'no-store',...options});let installedApps=[];const byId=id=>document.getElementById(id);
async function apiJson(query,options={}){const response=await api(query,options);const text=await response.text();let result;try{result=JSON.parse(text)}catch(error){if(text.trim().startsWith('#!'))throw new Error('CGI временно недоступен. WebUI повторит запрос автоматически');throw new Error('Некорректный ответ API: '+text.trim().slice(0,100))}if(!response.ok||result.ok===false)throw new Error(result.error||('HTTP '+response.status));return result}
function setBusy(text,active=true){byId('notice').textContent=text;byId('applyBtn').disabled=active;byId('restartBtn').disabled=active}
function clearBusy(text){byId('notice').textContent=text;byId('applyBtn').disabled=false;byId('restartBtn').disabled=false}
async function refreshStatus(){try{const data=await apiJson('action=status');byId('state').innerHTML=(data.running?'<span class="ok">&#9679; Работает</span>':'<span class="bad">&#9679; Остановлен</span>')+' · PID '+data.pid+' · WebUI: 127.0.0.1:'+data.webui_port;byId('mode').value=data.mode.toLowerCase();byId('quic').value=data.quic_mode.toLowerCase();byId('tcp').value=data.force_tcp;if(byId('notice').textContent.includes('CGI временно'))byId('notice').textContent='Соединение с модулем восстановлено'}catch(error){byId('state').innerHTML='<span class="bad">Ошибка получения статуса — повтор через 5 секунд</span>';byId('notice').textContent=error.message}}
async function runCommand(command,value=''){setBusy('Выполняется команда…');try{await apiJson('action=command&cmd='+encodeURIComponent(command)+'&value='+encodeURIComponent(value));await refreshStatus();await loadApps();clearBusy('Готово')}catch(error){clearBusy('Ошибка: '+error.message)}}
async function applySettings(){setBusy('Применение настроек…');try{const query='action=command&cmd=settings&mode='+byId('mode').value+'&quic='+byId('quic').value+'&tcp='+byId('tcp').value;await apiJson(query);await refreshStatus();clearBusy('Настройки применены')}catch(error){clearBusy('Ошибка: '+error.message)}}
async function loadApps(){try{installedApps=await apiJson('action=apps');renderApps()}catch(error){byId('apps').innerHTML='<p class="bad">Ошибка списка: '+error.message+'; повтор через 5 секунд</p>'}}
function renderApps(){const query=byId('search').value.toLowerCase();const html=installedApps.filter(app=>app.pkg.toLowerCase().includes(query)).slice(0,120).map(app=>`<p><code>${app.pkg}</code> <button onclick="runCommand('${app.include?'del':'add'}','${app.pkg}')">${app.include?'убрать из INCLUDE':'в INCLUDE'}</button> <button onclick="runCommand('${app.exclude?'del-exclude':'add-exclude'}','${app.pkg}')">${app.exclude?'убрать из EXCLUDE':'в EXCLUDE'}</button></p>`).join('');byId('apps').innerHTML=html||'<p>Ничего не найдено</p>'}
async function readList(){try{byId('listText').value=await(api('action=read-list&list='+byId('list').value)).then(response=>response.text())}catch(error){byId('notice').textContent='Ошибка списка: '+error.message}}
async function saveList(){setBusy('Сохранение списка…');try{await apiJson('action=save-list&list='+byId('list').value,{method:'POST',headers:{'Content-Type':'text/plain'},body:byId('listText').value});await refreshStatus();clearBusy('Список сохранён')}catch(error){clearBusy('Ошибка: '+error.message)}}
async function loadLog(){try{byId('log').textContent=await(api('action=log')).then(response=>response.text())}catch(error){byId('log').textContent='Ошибка: '+error.message}}
// Запуск нативной реализации выполняется ниже.
</script><script>
// Нативный KernelSU WebUI: менеджер сам загружает страницу и предоставляет root API ksu.exec.
const nativeModDir=(()=>{try{const info=window.ksu&&window.ksu.moduleInfo?JSON.parse(window.ksu.moduleInfo()):{};return info.moduleDir||('/data/adb/modules/'+(info.id||'zapret2-android'))}catch(_){return '/data/adb/modules/zapret2-android'}})(),nativeCtrl=nativeModDir+'/system/bin/zapret2-control';
const nativeLists={apps:nativeModDir+'/apps.list',exclude:nativeModDir+'/exclude.list','auto-domains':nativeModDir+'/auto_domains.list','exclude-domains':nativeModDir+'/exclude_domains.list','force-tcp':nativeModDir+'/force_tcp_apps.list'};
const shellQuote=value=>"'"+String(value).replace(/'/g,"'\\''")+"'";
async function nativeExec(command){if(!window.ksu||typeof window.ksu.exec!=='function')throw new Error('Откройте WebUI из KernelSU Next');let result=window.ksu.exec(command);if(result&&typeof result.then==='function')result=await result;if(typeof result==='string')return{stdout:result,stderr:'',errno:0};const errno=Number(result&&((result.errno??result.code)??0));if(errno!==0)throw new Error((result&&result.stderr)||('Код ошибки '+errno));return{stdout:(result&&result.stdout)||'',stderr:(result&&result.stderr)||'',errno};}
const nativeControl=(...args)=>nativeExec(shellQuote(nativeCtrl)+' '+args.map(shellQuote).join(' '));
async function refreshStatus(){try{const data=JSON.parse((await nativeControl('json-status')).stdout);byId('state').innerHTML=(data.running?'<span class="ok">&#9679; Работает</span>':'<span class="bad">&#9679; Остановлен</span>')+' · PID '+data.pid+' · WebUI KernelSU';byId('mode').value=data.mode.toLowerCase();byId('quic').value=data.quic_mode.toLowerCase();byId('tcp').value=data.force_tcp}catch(error){byId('state').innerHTML='<span class="bad">Ошибка получения статуса — повтор через 5 секунд</span>';byId('notice').textContent=error.message}}
async function runCommand(command,value=''){setBusy('Выполняется команда…');try{await nativeControl(command,value);await refreshStatus();await loadApps();clearBusy('Готово')}catch(error){clearBusy('Ошибка: '+error.message)}}
async function applySettings(){setBusy('Применение настроек…');try{await nativeControl('settings',byId('mode').value,byId('quic').value,byId('tcp').value);await refreshStatus();clearBusy('Настройки применены')}catch(error){clearBusy('Ошибка: '+error.message)}}
async function loadApps(){try{installedApps=JSON.parse((await nativeControl('json-apps')).stdout);renderApps()}catch(error){byId('apps').innerHTML='<p class="bad">Ошибка списка: '+error.message+'; повтор через 5 секунд</p>'}}
async function readList(){try{const list=byId('list').value;byId('listText').value=(await nativeExec('cat '+shellQuote(nativeLists[list]))).stdout}catch(error){byId('notice').textContent='Ошибка списка: '+error.message}}
async function saveList(){setBusy('Сохранение списка…');try{await nativeControl('replace-list',byId('list').value,byId('listText').value);await refreshStatus();clearBusy('Список сохранён')}catch(error){clearBusy('Ошибка: '+error.message)}}
async function loadLog(){try{byId('log').textContent=(await nativeControl('log')).stdout}catch(error){byId('log').textContent='Ошибка: '+error.message}}
refreshStatus();readList();loadLog();
</script><script>
// Список приложений получает KernelSU API, а не pm/awk: это даёт системные признаки и подписи приложений.
const appScope=document.createElement('div');appScope.className='app-filters';appScope.innerHTML='<label><input id="showUser" type="checkbox" checked> Пользовательские</label> <label><input id="showSystem" type="checkbox" checked> Системные</label>';byId('search').parentNode.insertBefore(appScope,byId('apps'));
const packageJson=raw=>Array.isArray(raw)?raw:JSON.parse(raw||'[]');
const packageNameOf=value=>{if(typeof value==='string')return value.trim();if(!value||typeof value!=='object')return '';return String(value.packageName||value.package||value.pkg||value.name||'').trim()};
function nativePackageList(type){let raw;if(window.ksu&&typeof window.ksu.listPackages==='function')raw=window.ksu.listPackages(type);else if(type==='all'&&window.ksu&&typeof window.ksu.listAllPackages==='function')raw=window.ksu.listAllPackages();else throw new Error('KernelSU API списка приложений недоступен');return packageJson(raw).map(packageNameOf).filter(Boolean)}
function nativePackageInfo(names){if(!window.ksu||typeof window.ksu.getPackagesInfo!=='function')throw new Error('KernelSU API сведений о приложениях недоступен');return packageJson(window.ksu.getPackagesInfo(JSON.stringify(names)))}
async function readNativeList(name){return (await nativeExec('cat '+shellQuote(nativeLists[name]))).stdout.split(/\r?\n/).map(x=>x.trim()).filter(x=>x&&!x.startsWith('#')).map(packageNameOf).filter(Boolean)}
async function loadApps(){try{const user=byId('showUser').checked,system=byId('showSystem').checked;if(!user&&!system){installedApps=[];renderApps();return}let names=[];if(user)names=names.concat(nativePackageList('user'));if(system)names=names.concat(nativePackageList('system'));names=[...new Set(names)];let info=[];for(let i=0;i<names.length;i+=100){const batch=nativePackageInfo(names.slice(i,i+100));info=info.concat(Array.isArray(batch)?batch:(batch.packages||batch.data||[]))}const stateRaw=JSON.parse((await nativeControl('json-apps')).stdout),state=Array.isArray(stateRaw)?stateRaw:(stateRaw.apps||stateRaw.packages||stateRaw.data||[]);const stateByPkg=new Map(state.map(x=>[packageNameOf(x),x]));installedApps=info.filter(x=>x&&!x.error).map(x=>{const pkg=packageNameOf(x),saved=stateByPkg.get(pkg)||{};return {pkg,label:x.appLabel||x.label||'',isSystem:x.isSystem===true,include:saved.include===true,exclude:saved.exclude===true}}).filter(x=>x.pkg);renderApps()}catch(error){byId('apps').innerHTML='<p class="bad">Ошибка списка: '+error.message+'; повтор через 5 секунд</p>'}}
function htmlEscape(value){return String(value).replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]))}
function renderApps(){const query=byId('search').value.toLowerCase().trim();const html=installedApps.filter(app=>(app.pkg+' '+app.label).toLowerCase().includes(query)).slice(0,300).map(app=>{const pkg=htmlEscape(app.pkg);return '<div class="app-row"><span class="app-name"><b>'+htmlEscape(app.label||app.pkg)+'</b><small>'+pkg+(app.isSystem?' · система':' · пользователь')+'</small></span><label><input type="checkbox" '+(app.include?'checked':'')+' onchange="toggleApp(\''+app.pkg+'\',\'include\',this.checked)"> INCLUDE</label><label><input type="checkbox" '+(app.exclude?'checked':'')+' onchange="toggleApp(\''+app.pkg+'\',\'exclude\',this.checked)"> EXCLUDE</label></div>'}).join('');byId('apps').innerHTML=html||'<p>Ничего не найдено</p>'}
async function toggleApp(pkg,list,checked){const command=list==='include'?(checked?'add':'del'):(checked?'add-exclude':'del-exclude');await runCommand(command,pkg)}
byId('showUser').addEventListener('change',loadApps);byId('showSystem').addEventListener('change',loadApps);loadApps();
</script><script>
// Отображаем понятное название приложения, а package name оставляем вторичной подписью.
function renderApps(){const query=byId('search').value.toLowerCase().trim();const html=installedApps.filter(app=>(app.pkg+' '+app.label).toLowerCase().includes(query)).sort((a,b)=>(a.label||a.pkg).localeCompare(b.label||b.pkg,'ru')).slice(0,300).map(app=>{const pkg=htmlEscape(app.pkg),icon='ksu://icon/'+encodeURIComponent(app.pkg);return '<div class="app-row"><img src="'+icon+'" alt="" style="width:32px;height:32px;border-radius:7px;object-fit:cover;background:#263449"><span class="app-name"><b>'+htmlEscape(app.label||app.pkg)+'</b><small>'+pkg+(app.isSystem?' · система':' · пользователь')+'</small></span><label><input type="checkbox" '+(app.include?'checked':'')+' onchange="toggleApp(\''+app.pkg+'\',\'include\',this.checked)"> INCLUDE</label><label><input type="checkbox" '+(app.exclude?'checked':'')+' onchange="toggleApp(\''+app.pkg+'\',\'exclude\',this.checked)"> EXCLUDE</label></div>'}).join('');byId('apps').innerHTML=html||'<p>Ничего не найдено</p>'}
renderApps();
</script><style>#apps{max-height:55vh;min-height:100px;overflow-y:auto;overscroll-behavior:contain;padding:4px 8px 4px 0}</style></body></html>
