# Глобальная конфигурация Zapret2 eCubz для Android
# Автор: eCubz (https://t.me/eCubz)
# Telegram группа: https://t.me/module_ecubz (t.me/module_ecubz)
#
# Списки управления модулем (автоматически отслеживаются inotifyd):
# 1. apps.list           - Пакеты приложений для режима INCLUDE
# 2. exclude.list        - Пакеты-исключения. EXCLUDE всегда имеет приоритет над apps.list
# 3. auto_domains.list   - Домены для десинка (--hostlist)
# 4. exclude_domains.list- Домены для исключения из десинка (--hostlist-exclude)

# Режим фильтрации трафика приложений:
# INCLUDE - обходить DPI только для пакетов из apps.list
# EXCLUDE - обходить DPI для всего устройства, КРОМЕ пакетов из exclude.list
# GLOBAL  - обходить DPI для всего трафика устройства без ограничений
MODE="INCLUDE"

# SELECTED — рекомендуемый режим по умолчанию: только apps.list попадает в NFQUEUE; QUIC тоже только apps.list.
# SAFE — всё, кроме exclude.list (широкий охват). ALL — весь телефон. CUSTOM — ручные настройки.
SCOPE_PRESET="SELECTED"

# Режим выбора стратегии десинка:
# SIMPLE - одна проверенная универсальная стратегия ALT4 (fake badseq + multisplit). Рекомендуется на Android.
# AUTO   - мультистратегия с автопереключением (требует поддержку conntrack ядер Android)
STRATEGY_MODE="AUTO"

# AUTO/circular должен видеть первые ответные пакеты сервера для conntrack.
# В INPUT/FORWARD отправляются только первые N reply-пакетов, bulk-трафик не очередится.
AUTO_REPLY_PACKETS="12"
# Внутренний connmark для привязки входящих reply-пакетов только к потокам, которые Zapret2 обрабатывает.
FLOW_CONNMARK="0x10000000/0x10000000"

# Принудительный перевод Telegram и других приложений с UDP на TCP:
# 1 - включено (REJECT только UDP/443 у приложений из apps.list -> QUIC/HTTP3 переключается на TCP)
# 0 - выключено
FORCE_TCP="1"

# Режим блокировки UDP для принудительного перехода на TCP:
# OFF — не блокировать QUIC; SELECTED — только UDP/443 приложений из apps.list;
# GLOBAL — UDP/443 всего устройства.
QUIC_MODE="SELECTED"

# Перехватываемые TCP порты (через запятую)
PORTS_TCP="80,443"

# Номер очереди NFQUEUE
QNUM="200"

# ============================================================================
# Совместимость и диагностика
# ============================================================================
# Подробный обычный лог службы: окружение, UID, capability probe, команды iptables
# и снимки счётчиков правил. Не включает дамп содержимого пакетов.
LOG_VERBOSE="1"

# На некоторых прошивках PackageManager после boot_completed ещё не готов полностью.
# Служба повторяет получение UID и использует дополнительные источники.
PACKAGE_WAIT_SECONDS="60"

# Низкоуровневый debug самого nfqws2. Включать временно при воспроизведении бага:
# лог может быстро расти, поэтому по умолчанию выключен.
NFQWS_DEBUG="0"

# Включение перехвата трафика устройств, подключённых к точке доступа Hotspot / USB-модему.
# Обработка привязана к downstream-интерфейсам и не должна затрагивать обычный VPN/форвардинг.
ENABLE_HOTSPOT="1"

# Шаблоны downstream-интерфейсов Android tethering. Символ + в iptables означает prefix wildcard.
# Не добавляйте сюда rmnet+, wlan0 или tun+, иначе можно задеть upstream/VPN.
TETHER_IFACES="ap+ swlan+ softap+ ap_br_wlan+ ap_br_softap+ rndis+ usb+ ncm+ bnep+ bt-pan+ pan+ tether+ wlan1 wlan2 wlan3 wlan4 wifi1 wifi2 wifi3 wifi4"

# Отключать QUIC (UDP/443) у клиентов Hotspot / USB-модема, чтобы приложения
# повторяли соединение по TCP и трафик попадал в Zapret2.
FORCE_TCP_HOTSPOT="1"

# Направлять клиентов Hotspot / USB-модема через VPN телефона.
# В v2.6.9 Zapret2 сам создаёт отдельную route-table для клиентов раздачи.
# Это не зависит от временных Android VPN tables и не затрагивает трафик самого телефона.
ENABLE_VPN_HOTSPOT="0"
VPN_TUN_NAME="AUTO"
VPN_ROUTE_PREF_BASE="20550"
VPN_ROUTE_TABLE="11999"
VPN_HOTSPOT_MASQUERADE="1"
# Поведение клиентов раздачи, если VPN недоступен:
# ANTIDPI — по умолчанию: продолжить интернет через обычный upstream телефона, но сохранить обработку Zapret2/NFQUEUE.
# BLOCK   — строгий режим: полностью блокировать интернет клиентов, пока VPN не появится.
VPN_FALLBACK_MODE="ANTIDPI"
# Legacy v2.6.8 compatibility. Новая логика использует VPN_FALLBACK_MODE.
VPN_HOTSPOT_KILLSWITCH="0"
# Проверка реального состояния VPN/tether-интерфейсов, сек.
VPN_WATCH_INTERVAL="2"
# Повторная попытка во время переходного состояния tun/hotspot (интерфейс уже есть, адрес ещё не готов).
VPN_RETRY_INTERVAL="1"
# Страховочная полная перепроверка Android VPN/tether ролей.
VPN_STATE_RECHECK="10"

# Автоматический перехват DNS-запросов (порт 53 UDP) от клиентов точки доступа Hotspot:
# 1 - перенаправлять DNS клиентов на защищённый публичный сервер через DNAT
# 0 - не перенаправлять
DNS_FORWARD_HOTSPOT="0"

# Сервер DNS для перенаправления запросов клиентов точки доступа
# DNS-резолверы клиентов точки доступа: Cloudflare, Google и Quad9.
# Каждый новый UDP-запрос равномерно распределяется между адресами.
# DNS_FORWARD_SERVER сохраняется как резерв для старых конфигураций.
DNS_FORWARD_SERVERS="1.1.1.1 1.0.0.1 8.8.8.8 8.8.4.4 9.9.9.9 149.112.112.112"
DNS_FORWARD_SERVER="1.1.1.1"

# ============================================================================
# SIMPLE: Проверенная рабочая стратегия ALT4 (fake badseq + multisplit)
# Используется при STRATEGY_MODE=SIMPLE
# ============================================================================
DESYNC_ARGS_SIMPLE="--filter-tcp=80,443 --filter-l7=http,tls --payload=tls_client_hello --lua-desync=fake:blob=0x00000000:repeats=6:tcp_seq=1000:tcp_ack=-66000:tcp_ts_up --lua-desync=multisplit --payload=http_req --lua-desync=fake:blob=0x00000000:repeats=6:tcp_seq=1000:tcp_ack=-66000:tcp_ts_up --lua-desync=multisplit"

# ============================================================================
# AUTO: Мультистратегия circular с автопереключением
# Используется при STRATEGY_MODE=AUTO
# ============================================================================
DESYNC_ARGS_AUTO="--filter-tcp=443,80 --filter-l7=http,tls --payload=tls_client_hello --lua-desync=circular:fails=2:time=300:retrans=3:nld=2 --lua-desync=fake:blob=0x00000000:repeats=6:tcp_seq=1000:tcp_ack=-66000:tcp_ts_up:strategy=1 --lua-desync=multisplit:strategy=1 --lua-desync=fake:blob=0x00000000:repeats=2:tcp_seq=1000:strategy=2 --lua-desync=multisplit:pos=1,midsld:seqovl=1:strategy=2 --lua-desync=fake:blob=0x00000000:repeats=1:strategy=3 --lua-desync=multisplit:strategy=3 --payload=http_req --lua-desync=circular:fails=2:time=300:retrans=3:nld=2 --lua-desync=fake:blob=0x00000000:repeats=6:tcp_seq=1000:tcp_ack=-66000:tcp_ts_up:strategy=1 --lua-desync=multisplit:strategy=1 --lua-desync=fake:blob=0x00000000:repeats=2:tcp_seq=1000:strategy=2 --lua-desync=multisplit:strategy=2"

# Дополнительная стратегия только для доменов из auto_domains.list.
DESYNC_ARGS_ALT="--filter-tcp=80,443 --filter-l7=http,tls --payload=tls_client_hello --lua-desync=fake:blob=fake_default_tls:repeats=2:tcp_seq=1000:tcp_ack=-66000:tcp_ts_up --lua-desync=multisplit"

# Пользовательская основная стратегия для STRATEGY_MODE=CUSTOM.
DESYNC_ARGS_CUSTOM="--filter-tcp=80,443 --filter-l7=http,tls --payload=tls_client_hello --lua-desync=fake:blob=0x00000000:repeats=6:tcp_seq=1000:tcp_ack=-66000:tcp_ts_up --lua-desync=multisplit"
