# Глобальная конфигурация Zapret2 eCubz для Android
# Автор: eCubz (https://t.me/eCubz)
# Telegram группа: https://t.me/module_ecubz (t.me/module_ecubz)
#
# Списки управления модулем (автоматически отслеживаются inotifyd):
# 1. apps.list           - Пакеты приложений для режима INCLUDE
# 2. exclude.list        - Пакеты приложений для режима EXCLUDE (пропускаются iptables)
# 3. auto_domains.list   - Домены для десинка (--hostlist)
# 4. exclude_domains.list- Домены для исключения из десинка (--hostlist-exclude)
# 5. force_tcp_apps.list - Приложения для принудительного перевода на TCP

# Режим фильтрации трафика приложений:
# INCLUDE - обходить DPI только для пакетов из apps.list
# EXCLUDE - обходить DPI для всего устройства, КРОМЕ пакетов из exclude.list
# GLOBAL  - обходить DPI для всего трафика устройства без ограничений
MODE="EXCLUDE"

# Режим выбора стратегии десинка:
# SIMPLE - одна жёсткая проверенная стратегия (ALT4 fake badseq + multisplit)
# AUTO   - circular с автоматическим переключением стратегий при сбоях (per-host умный выбор)
STRATEGY_MODE="AUTO"

# Принудительный перевод Telegram и других приложений с UDP на TCP:
# 1 - включено (REJECT UDP пакетов для приложений из force_tcp_apps.list -> клиент переключается на TCP)
# 0 - выключено
FORCE_TCP="1"

# Режим блокировки UDP для принудительного перехода на TCP:
# OFF — не блокировать UDP; SELECTED — только приложения из force_tcp_apps.list;
# GLOBAL — весь трафик устройства (может отключить QUIC у всех приложений).
QUIC_MODE="SELECTED"

# Локальный WebUI использует только 127.0.0.1. Смените порт при конфликте.
WEBUI_PORT="18080"

# Перехватываемые TCP порты (через запятую)
PORTS_TCP="80,443"

# Номер очереди NFQUEUE
QNUM="200"

# ============================================================================
# SIMPLE: Проверенная рабочая стратегия ALT4 (fake badseq + multisplit)
# Используется при STRATEGY_MODE=SIMPLE
# ============================================================================
DESYNC_ARGS_SIMPLE="--filter-tcp=80,443 --filter-l7=http,tls --payload=tls_client_hello --lua-desync=fake:blob=0x00000000:repeats=6:tcp_seq=1000:tcp_ack=-66000:tcp_ts_up --lua-desync=multisplit --payload=http_req --lua-desync=fake:blob=0x00000000:repeats=6:tcp_seq=1000:tcp_ack=-66000:tcp_ts_up --lua-desync=multisplit"

# ============================================================================
# AUTO: Мультистратегия circular с автопереключением
# Используется при STRATEGY_MODE=AUTO
# ============================================================================
DESYNC_ARGS_AUTO="--filter-tcp=443,80 --filter-l7=http,tls --payload=tls_client_hello --lua-desync=circular:fails=2:time=300:retrans=3:nld=2 --lua-desync=fake:blob=0x00000000:repeats=6:tcp_seq=1000:tcp_ack=-66000:tcp_ts_up:strategy=1 --lua-desync=multisplit:strategy=1 --lua-desync=fake:blob=0x00000000:repeats=2:tcp_seq=1000:strategy=2 --lua-desync=multisplit:pos=1,midsld:seqovl=1:strategy=2 --lua-desync=fake:blob=0x00000000:repeats=1:strategy=3 --lua-desync=multisplit:strategy=3 --payload=http_req --lua-desync=circular:fails=2:time=300:retrans=3:nld=2 --lua-desync=fake:blob=0x00000000:repeats=6:tcp_seq=1000:tcp_ack=-66000:tcp_ts_up:strategy=1 --lua-desync=multisplit:strategy=1 --lua-desync=fake:blob=0x00000000:repeats=2:tcp_seq=1000:strategy=2 --lua-desync=multisplit:strategy=2"

# Дополнительная стратегия только для доменов из auto_domains.list.
DESYNC_ARGS_ALT="--filter-tcp=80,443 --filter-l7=http,tls --payload=tls_client_hello --lua-desync=fake:blob=fake_default_tls:repeats=2:tcp_seq=1000:tcp_ack=-66000:tcp_ts_up --lua-desync=multisplit"
