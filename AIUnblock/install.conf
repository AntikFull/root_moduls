# AI Unblock RU — пользовательские настройки
# Основной обход ChatGPT/Gemini/Claude/Grok/NotebookLM работает всегда
# только для приложений из apps.list и apps.user.list.
# Настройки ниже относятся только к дополнительным функциям.
# Для переключателей: 0 = выключено, 1 = включено. FAIL_MODE описан отдельно.
# После ручного изменения hosts-настроек рекомендуется перезагрузка устройства.

# Дополнительный системный hosts для маршрутизации/разблокировки доменов.
# Работает для всей системы, а не только для приложений из apps.list.
# При обнаружении другого hosts-модуля AI Unblock сам отключит только эту функцию;
# основной per-app обход продолжит работать. По умолчанию: 0.
ENABLE_HOSTS_ROUTING=0

# Дополнительная блокировка рекламы и трекеров через системный hosts.
# Работает для всей системы. Может использоваться отдельно от hosts-маршрутизации.
# При конфликте с другим hosts-модулем автоматически не подключается. По умолчанию: 0.
ENABLE_ADBLOCK=0

# Принудительно выставлять английский язык (en-US) для поддерживаемых AI-приложений.
# 0 = не менять язык приложений; 1 = включить en-US. По умолчанию: 0.
ENABLE_APP_LOCALE=0

# Поведение выбранных AI-приложений, если обход временно недоступен.
# 0 = только ПРИ АВАРИИ обхода разрешить приложению обычное прямое подключение.
#     В нормальном состоянии правила AI Unblock продолжают работать.
# 1 = при аварии обхода запретить прямой выход до восстановления AI Unblock.
# Рекомендуемое и стандартное значение: 0.
FAIL_MODE=0

# Страна, выход через которую считается НЕ обходом блокировки.
# Проверяется по данным Cloudflare (/cdn-cgi/trace) при выборе gateway.
# Без этой проверки заблокированный сервер отвечает обычным кодом 403/200
# и модуль принимает его за рабочий маршрут.
# Двухбуквенный код страны или off, чтобы не проверять. По умолчанию: RU.
BLOCKED_LOC=RU
