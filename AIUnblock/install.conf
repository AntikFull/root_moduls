# AI Unblock RU — пользовательские настройки
# Основной обход ChatGPT/Gemini/Claude/Grok/NotebookLM работает автоматически
# строго для приложений из apps.list и apps.user.list.
# Для переключателей: 0 = выключено, 1 = включено.

# Принудительно выставлять английский язык (en-US) для поддерживаемых AI-приложений.
# 0 = не менять язык приложений; 1 = включить en-US. По умолчанию: 0.
ENABLE_APP_LOCALE=0

# Поведение выбранных AI-приложений, если обход временно недоступен.
# 0 = при аварии обхода разрешить приложению прямое подключение.
# 1 = при аварии обхода запретить прямой выход до восстановления AI Unblock.
# Рекомендуемое значение: 0.
FAIL_MODE=0

# Страна, выход через которую считается НЕ обходом блокировки.
# Проверяется по данным Cloudflare (/cdn-cgi/trace) при выборе gateway.
# Двухбуквенный код страны или off, чтобы не проверять. По умолчанию: RU.
BLOCKED_LOC=RU
